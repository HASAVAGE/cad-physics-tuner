[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-physics-tuner"
version = "0.1.0"
description = "Auto-calibrate physics for CAD, production-ready USD in Isaac Sim"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["robotics", "physics", "usd", "isaac-sim", "calibration", "urdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
cad-physics-tuner = "cad_physics_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cad_physics_tuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
